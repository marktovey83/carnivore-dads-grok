# Carnivore Dads server on Cloudflare Workers — Grok only.
# TEMPORARY: key is in vars for testing. Rotate after this works.
name = "carnivore-dads-server"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[vars]
# The sites allowed to call the server: the live app, and local testing.
ALLOWED_ORIGINS = "https://marktovey83.github.io,http://localhost:5173,http://localhost:8123"
# TEMPORARY TEST KEY — replace with secret after image works
GROK_KEY = "REPLACE_WITH_YOUR_KEY"

# At most 6 scan body calls a minute from one connection.
[[ratelimits]]
name = "SCAN_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 6
  period = 60

# At most 10 ketone explanations a minute from one connection.
[[ratelimits]]
name = "KETONE_LIMIT"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 10
  period = 60
